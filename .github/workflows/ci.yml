name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Mesmos testes de banco contra um PostgreSQL de verdade.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hexmp
          POSTGRES_PASSWORD: hexmp
          POSTGRES_DB: hexmp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hexmp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEXMP_TEST_POSTGRES_URL: postgres://hexmp:hexmp@localhost:5432/hexmp_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p hexmp-db -p hexmp-auth
