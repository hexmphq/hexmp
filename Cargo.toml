[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-PolyForm-Shield-1.0.0"
repository = "https://github.com/hexmphq/hexmp"
publish = false

[workspace.dependencies]
hexmp-protocol = { path = "crates/protocol" }
hexmp-sim = { path = "crates/sim" }
hexmp-server = { path = "crates/server" }
hexmp-headless-bot = { path = "crates/headless-bot" }
hexmp-scripting = { path = "crates/scripting" }
hexmp-db = { path = "crates/db" }
hexmp-auth = { path = "crates/auth" }
hexmp-ticket = { path = "crates/ticket" }
hexmp-client = { path = "crates/client" }
bitcode = "0.6.9"
mlua = { version = "0.12.2", features = ["luau"] }
renet2 = "1.0.1"
renet2_netcode = "1.0.1"
tracing = "0.1"
sqlx = { version = "0.9.1", default-features = false, features = ["any", "postgres", "sqlite", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1", features = ["rt", "time"] }
flume = "0.12"
uuid = { version = "1.29", features = ["v7"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ed25519-dalek = "3"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
ctrlc = { version = "3.5", features = ["termination"] }

[profile.release]
lto = "thin"
codegen-units = 1
