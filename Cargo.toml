[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-PolyForm-Shield-1.0.0"
repository = "https://github.com/hexmphq/hexmp"
publish = false

[workspace.dependencies]
hexmp-protocol = { path = "crates/protocol" }
hexmp-sim = { path = "crates/sim" }

[profile.release]
lto = "thin"
codegen-units = 1
