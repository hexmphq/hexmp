[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-PolyForm-Shield-1.0.0"
repository = "https://github.com/hexmphq/hexmp"
publish = false

[workspace.dependencies]
hexmp-protocol = { path = "crates/protocol" }
hexmp-sim = { path = "crates/sim" }
hexmp-server = { path = "crates/server" }
hexmp-headless-bot = { path = "crates/headless-bot" }
hexmp-scripting = { path = "crates/scripting" }
bitcode = "0.6.9"
mlua = { version = "0.12.2", features = ["luau"] }
renet2 = "1.0.1"
renet2_netcode = "1.0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
